name: Test and build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows-executable:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean packaging/HAL2030.spec
      - name: Smoke-test packaged app
        run: python tools/smoke_executable.py dist/HAL2030.exe --output-dir build/smoke
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: HAL2030-windows-x64-${{ github.sha }}
          path: |
            dist/HAL2030.exe
            LICENSE
            packaging/README.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAL2030-smoke-${{ github.sha }}
          path: build/smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
